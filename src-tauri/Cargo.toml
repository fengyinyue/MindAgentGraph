[package]
name = "mindagentgraph"
version = "0.1.0"
description = "Node-based AI planning tool"
authors = ["MindAgentGraph"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mindagentgraph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
once_cell = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
